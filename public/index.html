<!doctype html>
<html lang="ku">

<head>

<meta name="google-site-verification" content="VPkGdjylhkUqsDOPwJ9cjAKmLuiDyclPioRVpLMWw7s" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MALIK APPS</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,sans-serif
}

header{
  padding:28px;
  text-align:center;
  background:#171717;
  border-bottom:2px solid #ff2d75
}

h1{
  margin:0;
  color:#ff2d75
}

.container{
  max-width:1100px;
  margin:auto;
  padding:24px
}

.apps{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px
}

.card{
  background:#181818;
  padding:18px;
  border-radius:15px;
  margin-bottom:20px
}

.icon{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px
}

.small{
  color:#aaa
}

.badge{
  display:inline-block;
  background:#292929;
  padding:5px 8px;
  border-radius:15px;
  color:#ff7da9;
  font-size:12px;
  margin-right:5px
}

.download{
  display:block;
  text-align:center;
  padding:11px;
  border-radius:8px;
  text-decoration:none;
  margin-top:10px;
  background:#ff2d75;
  color:#fff;
  font-weight:bold
}

</style>

</head>

<body>

<header>

<h1>📱 MALIK APPS</h1>

<p>APK و IPA ـەکان</p>

</header>

<main class="container">

<h2>📱 Applications</h2>

<div id="apps" class="apps"></div>

</main>

<script>

const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m]));

async function load(){

try{

const response=await fetch('/api/apps');

if(!response.ok)
throw new Error('Failed');

const apps=await response.json();

const container=document.getElementById('apps');

if(!apps.length){

container.innerHTML=
'<p class="small">هێشتا هیچ ئەپێک upload نەکراوە.</p>';

return;

}

container.innerHTML=apps.map(x=>{

const image=x.iconFileName

?'/uploads/'+encodeURIComponent(x.iconFileName)

:'data:image/svg+xml;charset=UTF-8,'+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300">

<rect width="100%" height="100%" fill="#252525"/>

<text
x="50%"
y="50%"
fill="white"
font-size="38"
text-anchor="middle">

MALIK APPS

</text>

</svg>
`);

return `

<article class="card">

<img
class="icon"
src="${image}"
alt="">

<h3>${esc(x.name)}</h3>

<span class="badge">
${esc(x.type)}
</span>

<span class="badge">
v${esc(x.version)}
</span>

<p class="small">
${esc(x.description)}
</p>

<a
class="download"
href="${x.downloadUrl}"
download>

⬇️ Download

</a>

</article>

`;

}).join('');

}catch(error){

document.getElementById('apps').innerHTML=

'<p class="small">❌ کێشەیەک لە بارکردنی ئەپەکان هەیە.</p>';

console.error(error);

}

}

load();

</script>

</body>

</html>
