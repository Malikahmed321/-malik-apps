<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MALIK APPS - APK & IPA</title>

<meta name="description" content="MALIK APPS - APK و IPA بۆ دابەزاندن">
<meta name="robots" content="index,follow">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0d0d0d;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:35px 20px;
text-align:center;
background:#171717;
border-bottom:2px solid #ff2d75;
}

h1{
margin:0;
color:#ff2d75;
font-size:32px;
}

header p{
color:#aaa;
}

.container{
max-width:1100px;
margin:auto;
padding:25px;
}

.search{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#292929;
color:white;
font-size:16px;
margin-bottom:25px;
}

.apps{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:18px;
}

.card{
background:#181818;
padding:18px;
border-radius:15px;
}

.icon{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
background:#252525;
}

.badge{
display:inline-block;
background:#292929;
padding:5px 9px;
border-radius:15px;
color:#ff7da9;
font-size:12px;
margin-top:5px;
}

.download{
display:block;
text-align:center;
padding:12px;
border-radius:8px;
background:#ff2d75;
color:white;
font-weight:bold;
text-decoration:none;
margin-top:12px;
}

.small{
color:#aaa;
}

.empty{
color:#aaa;
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<header>
<h1>📱 MALIK APPS</h1>
<p>APK و IPA ـەکان</p>
</header>

<main class="container">

<input
class="search"
id="search"
type="search"
placeholder="🔎 گەڕان بە ناوی ئەپ..."
>

<div id="apps" class="apps"></div>

</main>

<script>

/*
  MALIK APPS
  Apps list
*/

const apps = [

  /*
    نموونە:

    {
      name: "My App",
      version: "1.0",
      type: "APK",
      description: "دەربارەی ئەپەکە",
      icon: "icon.png",
      download: "app.apk"
    }

  */

];


const appsBox =
document.getElementById("apps");

const search =
document.getElementById("search");


function esc(text){

return String(text || "")
.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

});

}


function showApps(list){

if(!list.length){

appsBox.innerHTML =
'<div class="empty">هێشتا هیچ ئەپێک دانەنراوە.</div>';

return;

}


appsBox.innerHTML =
list.map(function(app){

return `

<article class="card">

<img
class="icon"
src="${esc(app.icon || '')}"
alt="${esc(app.name)}"
onerror="this.style.display='none'"
>

<h2>${esc(app.name)}</h2>

<span class="badge">
${esc(app.type)}
</span>

<span class="badge">
v${esc(app.version)}
</span>

<p class="small">
${esc(app.description)}
</p>

<a
class="download"
href="${esc(app.download)}"
download
>
⬇️ Download
</a>

</article>

`;

}).join("");

}


search.addEventListener("input",function(){

const word =
search.value.toLowerCase().trim();

const filtered =
apps.filter(function(app){

return app.name
.toLowerCase()
.includes(word);

});

showApps(filtered);

});


showApps(apps);

</script>

</body>
</html>
